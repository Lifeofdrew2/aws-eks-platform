apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
images:
  # scripts/deploy.sh sets this to the ECR URL and tag at deploy time.
  - name: demo-api
    newName: demo-api
    newTag: latest
